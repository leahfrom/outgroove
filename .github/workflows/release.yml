name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            artifact: macos-arm64
            package-path: out/make/zip/darwin/arm64/*.zip
          # Current native SQLite tooling supports Visual Studio 2022, not 2026.
          - os: windows-2022
            platform: Windows
            artifact: windows-x64
            package-path: out/make/zip/win32/x64/*.zip
          - os: ubuntu-latest
            platform: Linux
            artifact: linux-x64
            package-path: out/make/zip/linux/x64/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run flow:validate-release-tag
      - run: npm run verify
      - run: npm run make
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke
      - if: runner.os != 'Linux'
        run: npm run test:smoke
      - name: Upload packaged ZIP
        uses: actions/upload-artifact@v7
        with:
          name: outgroove-${{ github.ref_name }}-${{ matrix.artifact }}
          # Keeping the wildcard in the final segment makes upload-artifact
          # strip Forge's platform/architecture directories on download.
          path: ${{ matrix.package-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged ZIPs
        uses: actions/download-artifact@v8
        with:
          pattern: outgroove-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: sha256sum release-assets/*.zip > release-assets/SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Automated Outgroove test build for macOS arm64, Windows x64, and Linux x64.

            These applications are unsigned and not notarized. macOS Gatekeeper and Windows SmartScreen may warn or block a first launch. This prerelease is intended for controlled fixture testing; back up real music before authorizing any metadata write.
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --title "Outgroove $GITHUB_REF_NAME"
          --prerelease
          --notes "$RELEASE_NOTES"
